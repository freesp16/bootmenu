name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN_IMAGE: bootmenu-toolchain:1

jobs:
  lint:
    name: Scripts, version and changelog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in image/*.sh tools/*.sh toolchain/*.sh; do sh -n "$f"; done
      - name: ShellCheck
        run: shellcheck -s sh -S warning -e SC1090,SC2034,SC2046,SC2086,SC2164,SC2254 image/*.sh tools/*.sh toolchain/*.sh
      - name: Python
        run: python3 -m py_compile tools/*.py
      - name: VERSION has a changelog section
        run: |
          grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' VERSION || { echo "::error::VERSION must be X.Y.Z"; exit 1; }
          python3 tools/changelog.py --check "$(cat VERSION)"

  build:
    name: Build and test (armel)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Toolchain image
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          tags: ${{ env.TOOLCHAIN_IMAGE }}
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
      - name: Build
        run: tools/build.sh
      - name: Test the ARM build under qemu
        run: tools/test-arm.sh
      - name: Test the launcher scripts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox-static
          tools/test-launcher.sh
      - name: Package an image with a throwaway key (layout check only)
        run: |
          sudo apt-get install -y --no-install-recommends xorriso python3-cryptography
          BOOTMENU_AES_KEY=ci-throwaway-key-not-for-any-unit python3 tools/build-image.py --out out/autoexec-testkey.bin
      - uses: actions/upload-artifact@v4
        with:
          name: bootmenu-armel
          path: out/bootmenu
